name: HealthKit Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  healthkit-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run HealthKit guardrails
        run: npm run healthkit:check
